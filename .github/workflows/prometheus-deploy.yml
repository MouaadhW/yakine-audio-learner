name: Deploy Prometheus Rules

on:
  workflow_dispatch:
  push:
    paths:
      - 'monitoring/**'

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.30.0'
      - name: Decode kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "${KUBE_CONFIG_DATA:-}" ]; then
            echo "KUBE_CONFIG_DATA secret not set; aborting"
            exit 1
          fi
          echo "$KUBE_CONFIG_DATA" | base64 --decode > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl --kubeconfig=$PWD/kubeconfig get ns monitoring || kubectl create ns monitoring
          kubectl --kubeconfig=$PWD/kubeconfig apply -n monitoring -f monitoring/prometheus-rules.yml
      - name: Confirm rules applied
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl --kubeconfig=$PWD/kubeconfig get prometheusrules --all-namespaces || true
