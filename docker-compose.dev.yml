version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yakine_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  jaeger:
    image: jaegertracing/all-in-one:1.47
    ports:
      - '16686:16686'
      - '14268:14268'

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/prometheus.rules.yml
    command: --config.file=/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:9.5
    ports:
      - '3000:3000'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/yakine_dev
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ''
      SUPABASE_SERVICE_KEY: ''
      NODE_ENV: development
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis

  media-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.media
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/yakine_dev
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ''
      SUPABASE_SERVICE_KEY: ''
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
